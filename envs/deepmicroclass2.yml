name: deepmicroclass2

channels:
  - pytorch
  - conda-forge

dependencies:
  - python=3.10
  # PyTorch Lightning 2.2 imports pkg_resources. Setuptools 82 removed that
  # module, so pin the final compatible major release for reproducibility.
  - setuptools=81.0.0
  - pytorch::pytorch=2.2.2
  - pytorch::cpuonly
  - pytorch-lightning=2.2.5
  - torchmetrics=1.3.2
  - numpy=1.26.4
  - biopython=1.83
  - scikit-learn=1.4.2
