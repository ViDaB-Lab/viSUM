name: deepmicroclass2

channels:
  - pytorch
  - conda-forge

dependencies:
  - python=3.10
  - git
  # DeepMicroClass2 imports the deprecated pkg_resources API. Setuptools 81
  # warns on that import, so keep the last pre-warning release for now.
  - setuptools=80.9.0
  - pytorch::pytorch=2.2.2
  - pytorch::cpuonly
  # The bundled DeepMicroClass2 checkpoints were written with Lightning 2.4.0.
  # Matching that release avoids automatic checkpoint migration warnings.
  - pytorch-lightning=2.4.0
  - torchmetrics=1.3.2
  - numpy=1.26.4
  - pandas=2.2.2
  - biopython=1.83
  - scikit-learn=1.4.2
  - pysam=0.22.1
